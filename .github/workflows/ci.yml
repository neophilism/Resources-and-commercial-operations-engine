name: Engine checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
  postgres-contention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-admin-only
          POSTGRES_DB: resources_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resources_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          RCO_TEST_DISPOSABLE_POSTGRES: '1'
          RCO_TEST_ADMIN_URL: postgresql://postgres:fixture-admin-only@127.0.0.1:5432/resources_ci
